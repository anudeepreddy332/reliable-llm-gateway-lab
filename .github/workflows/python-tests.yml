
name: Python Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.115.12" \
            "pydantic==2.11.4" \
            "uvicorn==0.34.2" \
            "httpx==0.28.1" \
            "pytest==8.3.5"

      - name: Run tests
        run: python -m pytest -q
